<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New password · Spin It</title><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/base.css"><script src="/config.js"></script></head>
<body><main>
  <img class="logo" src="/logo-pink.png" alt="SpinIt">
  <div class="kicker">Forgot it? Happens.</div>
  <h1>Pick a new password.</h1>
  <input id="pw" type="password" autocomplete="new-password" placeholder="6+ characters">
  <button id="save">Save it</button>
  <div class="msg" id="msg" role="status"></div>
</main>
<script type="module" src="/reset.js"></script></body></html>
